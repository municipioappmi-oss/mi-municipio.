function renderLogin(){return `<main class="login-view"><section class="login-showcase"><div>${officialMark()}</div><div class="login-product">${logo()}<h1>Mi <span>Municipio</span></h1><p>Reporta problemas, consulta el avance y mejora tu comunidad. Una plataforma de atención ciudadana del municipio.</p></div><div class="login-showcase-foot"><strong>Tu reporte, nuestro compromiso</strong>H. Ayuntamiento de San Juan de los Lagos · Juntos por un mejor municipio</div></section><section class="login-card-wrap"><div class="login-card"><div class="eyebrow">PLATAFORMA MUNICIPAL</div><h2>Acceso institucional</h2><p class="login-subtitle">Ingresa con tu usuario y contraseña. El acceso depende de la cuenta y la dependencia asignada por el administrador.</p><form id="loginForm"><div class="field"><label for="loginRole">Tipo de acceso</label><select id="loginRole" name="role" class="input" required><option value="Dependencia">Personal de una dependencia</option><option value="Administrador">Administrador municipal</option></select></div><div class="field"><label for="loginIdentity">Usuario o correo institucional</label><input id="loginIdentity" class="input" name="identity" autocomplete="username" placeholder="Ej. jperez o admin" required></div><div class="field"><label for="loginPassword">Contraseña</label><input id="loginPassword" class="input" name="password" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required></div><button type="submit" class="btn btn-primary login-submit">${icon('shield')} Iniciar sesión</button></form><button type="button" class="btn btn-ghost login-back" data-action="citizen-home">Volver a la aplicación ciudadana</button><details class="demo-credentials" open><summary>Credenciales para probar la demostración</summary><div class="credentials-grid"><div class="credential"><strong>Administrador</strong><code>Usuario: admin</code><code>Contraseña: Admin2026!</code></div><div class="credential"><strong>Obras Públicas</strong><code>Usuario: jperez</code><code>Contraseña: Obras2026!</code></div><div class="credential"><strong>Servicios Públicos</strong><code>Usuario: alopez</code><code>Contraseña: Servicios2026!</code></div><div class="credential"><strong>Agua Potable</strong><code>Usuario: cruiz</code><code>Contraseña: Agua2026!</code></div></div></details><div class="login-tip">${icon('info',18)}<span>Estas credenciales sirven únicamente para probar el prototipo. Antes de usarlo con personal real se deberá conectar a un servidor de autenticación seguro.</span></div></div></section></main>`}
function renderShell(){const nav=navForMode();const activeLabel=nav.find(n=>n.page===state.page)?.label||'Detalle del reporte';const modeLabel=state.mode==='citizen'?'Ciudadano':state.mode==='dept'?'Dependencia':'Administrador';const currentUser=state.authenticatedUser;const avatarLabel=currentUser?(currentUser.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()):'MC';const header=`<header class="topbar">${brandHeader()}<div class="top-right">${state.mode==='citizen'?`<button class="btn btn-primary btn-sm" data-action="staff-login">${icon('shield')}<span class="access-label">Acceso institucional</span></button>`:`<div class="session-chip"><strong>${esc(currentUser?.name||modeLabel)}</strong><span>${esc(state.mode==='admin'?'Administración municipal':state.department)}</span></div><button class="btn btn-ghost btn-sm" data-action="logout">${icon('logout')} Cerrar sesión</button>`}<button class="top-icon" data-action="go" data-page="notifications" title="Notificaciones">${icon('bell')}<span style="position:absolute;right:-3px;top:-3px;background:#f04a60;color:white;border:2px solid white;border-radius:50%;width:10px;height:10px"></span></button><div class="avatar" title="${esc(currentUser?.name||modeLabel)}">${avatarLabel}</div></div></header>`;
const side=`<aside class="sidebar"><div class="sidebar-brand">${logo()}<div><strong>Mi Municipio</strong><small>${modeLabel}</small></div></div><div class="small" style="margin:0 10px 17px;color:#a8c9e4;font-size:9px;font-weight:800;line-height:1.4">H. AYUNTAMIENTO DE<br>SAN JUAN DE LOS LAGOS</div><div class="side-label">MENÚ PRINCIPAL</div><nav class="nav">${nav.map(n=>`<button class="nav-btn ${state.page===n.page?'active':''}" data-action="go" data-page="${n.page}">${icon(n.icon)}<span>${n.label}</span>${n.page==='notifications'?'<span class="nav-count">3</span>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-user"><div class="avatar">${avatarLabel}</div><div><strong>${esc(currentUser?.name||'Mi cuenta ciudadana')}</strong><small>${esc(state.mode==='admin'?'Acceso total':state.mode==='dept'?state.department:'Ciudadano')}</small></div></div>${state.mode!=='citizen'?`<button class="nav-btn" style="margin-top:12px" data-action="logout">${icon('logout')}<span>Cerrar sesión</span></button>`:''}</div></aside>`;
const mobile=`<div class="mobile-bottom">${(state.mode==='citizen'?[{page:'home',label:'Inicio',icon:'home'},{page:'new-report',label:'Reportar',icon:'plus'},{page:'lookup',label:'Consultar',icon:'search'},{page:'account',label:'Mi cuenta',icon:'user'}]:state.mode==='dept'?[{page:'dept-home',label:'Panel',icon:'home'},{page:'assigned',label:'Asignados',icon:'clipboard'},{page:'in-progress',label:'En proceso',icon:'clock'},{page:'resolved',label:'Resueltos',icon:'checkCircle'}]:[{page:'admin-home',label:'Dashboard',icon:'home'},{page:'all-reports',label:'Reportes',icon:'file'},{page:'departments',label:'Áreas',icon:'building'},{page:'statistics',label:'Estadísticas',icon:'chart'}]).map(n=>`<button class="${state.page===n.page?'active':''}" data-action="go" data-page="${n.page}">${icon(n.icon)}<span>${n.label}</span></button>`).join('')}</div>`;
return `${header}<div class="layout">${side}<main id="mainContent" class="main"><div class="mobile-menu"><span class="small">${activeLabel}</span><button class="icon-btn" data-action="toggle-notifications">${icon('bell')}</button></div>${renderPage()}</main></div>${mobile}`}
function pageHead(title,subtitle,actions=''){return `<div class="page-head"><div><div class="eyebrow">${state.mode==='admin'?'Centro de control municipal':state.mode==='dept'?'Gestión de reportes':'Servicios ciudadanos'}</div><h1 class="page-title">${title}</h1><p class="page-subtitle">${subtitle}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`}
function metric(label,value,iconName,color='blue',bottom='Actualizado hoy',trend=''){return `<div class="card metric"><div class="metric-top"><div class="metric-icon ${color==='green'?'green':color==='amber'?'amber':color==='purple'?'purple':''}">${icon(iconName)}</div>${trend?`<span class="trend">${trend}</span>`:''}</div><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-bottom"><span>${bottom}</span></div></div>`}
function filteredReports(list=state.mode==='dept'?reportsForMode():allReports()){let out=[...list];if(state.search){const q=state.search.toLowerCase();out=out.filter(r=>[r.id,r.category,r.title,r.location,r.department,r.description].some(x=>(x||'').toLowerCase().includes(q)))}if(state.statusFilter!=='Todos')out=out.filter(r=>r.status===state.statusFilter);if(state.departmentFilter!=='Todas')out=out.filter(r=>r.department===state.departmentFilter);if(state.categoryFilter!=='Todas')out=out.filter(r=>r.category===state.categoryFilter);return out.sort((a,b)=>b.id.localeCompare(a.id))}
function reportTable(list,opts={}){if(!list.length)return `<div class="empty">${icon('file',32)}<strong>No hay reportes para mostrar</strong><p>Prueba a cambiar los filtros o registra un nuevo reporte ciudadano.</p>${state.mode==='citizen'?`<button class="btn btn-primary" data-action="go" data-page="new-report">${icon('plus')} Crear reporte</button>`:''}</div>`;const showDep=opts.showDep??(state.mode==='admin');return `<div class="table-wrap"><table><thead><tr><th>Folio / problema</th><th>Categoría</th><th>Ubicación</th>${showDep?'<th>Dependencia</th>':''}<th>Estado</th><th>Fecha</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td><span class="folio">${esc(r.id)}</span><span class="table-main" style="margin-top:5px">${esc(r.title||r.category)}</span></td><td>${esc(r.category)}</td><td>${esc(r.location||'Ubicación por confirmar')}</td>${showDep?`<td>${esc(r.department)}</td>`:''}<td>${statusBadge(r.status)}</td><td>${esc(r.updated||r.created)}</td><td><button class="table-action" data-action="detail" data-id="${esc(r.id)}">Ver detalle</button></td></tr>`).join('')}</tbody></table></div>`}
function reportFilters(){return `<div class="filters"><div class="input-icon" style="min-width:210px;flex:1">${icon('search')}<input id="reportSearch" value="${esc(state.search)}" placeholder="Buscar por folio, descripción o ubicación…"></div><select id="statusFilter" class="input" style="width:auto;min-width:138px"><option>Todos</option>${['Recibido','Asignado','En proceso','En espera','Resuelto','Cerrado','Improcedente'].map(s=>`<option ${state.statusFilter===s?'selected':''}>${s}</option>`).join('')}</select>${state.mode==='admin'?`<select id="departmentFilter" class="input" style="width:auto;min-width:165px"><option>Todas</option>${DEPARTMENTS.map(d=>`<option ${state.departmentFilter===d.name?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:''}<button class="btn btn-ghost btn-sm" data-action="clear-filters">${icon('refresh')} Limpiar</button></div>`}
function homeCitizen(){const own=state.reports.filter(r=>r.citizen==='Ciudadano de prueba');const latest=own[0]||state.reports[0];return `${`<section class="hero"><div class="hero-copy"><div class="hero-kicker">Tu voz mejora nuestra comunidad</div><h2>Reporta. Da seguimiento.<br>Transforma tu municipio.</h2><p>Ayúdanos a mejorar los espacios públicos. Comparte una foto, marca la ubicación y consulta el avance de tu reporte desde cualquier lugar.</p><div class="head-actions"><button class="btn btn-green" data-action="go" data-page="new-report">${icon('plus')} Crear un reporte</button><button class="btn btn-ghost" data-action="go" data-page="lookup">${icon('search')} Consultar mi folio</button></div><div class="quick-stat">${icon('shield',19)}<div><strong>Seguimiento transparente</strong><br><span>Consulta cada actualización con tu folio</span></div></div></div><div class="hero-art"><div class="circle"><svg viewBox="0 0 120 120" fill="none"><path d="M10 92 32 78l17 7 22-18 18 8 19-14v37H10Z" fill="#18c48c"/><path d="M28 68V32h18V19h14v13h16v40H28Z" fill="#fff"/><path d="M36 42h9m-9 10h9m8-10h8m-8 10h8" stroke="#0874c5" stroke-width="4" stroke-linecap="round"/><path d="M60 37c-13 0-21 9-21 20 0 14 21 32 21 32s21-18 21-32c0-11-8-20-21-20Z" fill="#13bd84" stroke="white" stroke-width="3"/><circle cx="60" cy="57" r="7" fill="white"/><path d="M8 100c20-5 35-5 52 2s33 6 52-2" stroke="#b9e9ff" stroke-width="4" stroke-linecap="round"/></svg></div></div></section>`}<div style="height:18px"></div><div class="grid grid-3">${metric('Mis reportes',own.length,'file','blue','Registrados por ti')}${metric('En seguimiento',own.filter(r=>!['Resuelto','Cerrado','Improcedente'].includes(r.status)).length,'clock','amber','En atención municipal')}${metric('Resueltos',own.filter(r=>r.status==='Resuelto'||r.status==='Cerrado').length,'checkCircle','green','Casos concluidos')}</div><div style="height:18px"></div><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Consulta rápida de un reporte</h3><div class="card-sub">Escribe tu folio para revisar el estado actual.</div></div>${icon('search',20)}</div><form id="quickLookup" class="filters"><div class="input-icon" style="flex:1;min-width:220px">${icon('search')}<input name="folio" placeholder="Ej. MUN-2026-001248" value="${esc(state.queryFolio)}" required></div><button class="btn btn-primary">Consultar folio ${icon('arrow')}</button></form></section><div style="height:18px"></div><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Reportes recientes</h3><div class="card-sub">Ejemplos de actividad en la plataforma.</div></div><button class="link-btn" data-action="go" data-page="lookup">Consultar un folio ${icon('chevron',12)}</button></div>${reportTable(allReports().slice(0,4),{showDep:true})}</section>`}
function renderNewReport(){return `${pageHead('Crear un reporte','Describe el problema, adjunta una fotografía y señala dónde ocurre. El sistema generará tu folio al enviar el reporte.',`<button class="btn btn-ghost" data-action="go" data-page="home">${icon('back')} Volver al inicio</button>`)}<form id="newReportForm"><div class="grid grid-2"><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">1. Información del problema</h3><div class="card-sub">Cuéntanos qué sucede.</div></div><div class="metric-icon">${icon('clipboard')}</div></div><div class="form-grid"><div class="field span-2"><label for="reportCategory">Tipo de problema *</label><select id="reportCategory" name="category" required>${CATEGORIES.map(c=>`<option value="${esc(c.value)}">${esc(c.value)}</option>`).join('')}</select><small>La categoría determina qué dependencia recibirá tu reporte.</small></div><div class="field span-2"><label for="reportDescription">Descripción *</label><textarea id="reportDescription" name="description" required maxlength="1000" placeholder="Describe el problema, referencias cercanas y cualquier detalle útil…"></textarea><small id="descriptionCounter">0 / 1000 caracteres</small></div><div class="field"><label for="citizenName">Nombre (opcional)</label><input id="citizenName" name="citizen" placeholder="¿Cómo te llamas?" maxlength="90"></div><div class="field"><label for="citizenContact">Correo (opcional)</label><input id="citizenContact" name="contact" type="email" placeholder="correo@ejemplo.com"></div><div class="field span-2"><label>Fotografía (opcional, recomendada)</label><div class="upload-zone"><input type="file" id="reportPhoto" accept="image/*"><div><div class="upload-icon">${icon('camera',22)}</div><strong>Agregar fotografía del problema</strong><span>Selecciona una imagen JPG, PNG o WEBP. Máximo 8 MB.</span></div></div><img id="photoPreview" class="image-preview" style="display:none" alt="Vista previa de la fotografía"></div></div></section><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">2. Ubicación del problema</h3><div class="card-sub">Marca el punto en el mapa o comparte tu ubicación.</div></div><div class="metric-icon green">${icon('pin')}</div></div><div class="map-preview" id="reportMap"><div class="map-river"></div><div class="map-pin">${icon('pin',35)}</div><div class="map-caption" id="mapCaption">Ubicación de ejemplo · Centro municipal</div></div><div class="map-controls"><button class="btn btn-soft btn-sm" type="button" data-action="locate">${icon('pin')} Usar mi ubicación</button><button class="btn btn-ghost btn-sm" type="button" data-action="choose-location">${icon('map')} Usar ubicación de ejemplo</button></div><div class="field" style="margin-top:16px"><label for="reportLocation">Dirección o referencia *</label><input id="reportLocation" name="location" required value="Centro municipal, calle principal" placeholder="Calle, colonia o referencia"><small>En esta versión de demostración puedes editar la dirección. La integración con mapas reales se configurará en producción.</small></div><div class="form-grid" style="margin-top:13px"><div class="field"><label for="reportLat">Latitud (opcional)</label><input id="reportLat" name="lat" placeholder="21.0185" inputmode="decimal"></div><div class="field"><label for="reportLng">Longitud (opcional)</label><input id="reportLng" name="lng" placeholder="-102.2892" inputmode="decimal"></div></div><div class="divider"></div><div style="display:flex;gap:10px;align-items:flex-start;background:#f1f9f5;border:1px solid #d7f0e3;border-radius:11px;padding:12px">${icon('shield',19)}<div><strong style="font-size:11px">Tus datos se tratarán con cuidado</strong><div class="small muted" style="margin-top:4px;line-height:1.5">No incluyas información sensible en la descripción. Los datos personales no se mostrarán en la consulta pública.</div></div></div></section></div><div style="display:flex;gap:9px;justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" type="reset" data-action="reset-report">Limpiar formulario</button><button class="btn btn-green" type="submit">${icon('plus')} Enviar reporte</button></div></form>`}
function renderLookup(){return `${pageHead('Consultar un reporte','Ingresa el folio que recibiste al registrar tu reporte para ver el estado y las actualizaciones.') }<section class="card card-pad"><form id="lookupForm" class="filters"><div class="field" style="flex:1;min-width:230px"><label for="lookupFolio">Número de folio</label><div class="input-icon">${icon('search')}<input id="lookupFolio" name="folio" placeholder="Ej. MUN-2026-001248" value="${esc(state.queryFolio)}" required></div></div><button class="btn btn-primary" style="align-self:flex-end">Consultar ${icon('arrow')}</button></form><div class="small muted" style="margin-top:10px">Prueba con el folio de ejemplo <button class="link-btn" data-action="sample-lookup" style="padding:0">MUN-2026-001248</button>.</div></section><div style="height:16px"></div>${state.lookupResult!==undefined?renderLookupResult():`<section class="card card-pad"><div class="empty">${icon('search',32)}<strong>Consulta el avance de tu reporte</strong><p>Con tu folio puedes conocer la dependencia responsable, el estado actual y los comentarios públicos que se hayan registrado.</p></div></section>`}`}
function renderLookupResult(){if(state.lookupResult==='notfound')return `<section class="card card-pad"><div class="empty">${icon('alert',32)}<strong>No encontramos ese folio</strong><p>Revisa que lo hayas escrito correctamente. Si acabas de enviar el reporte, espera unos segundos y vuelve a consultar.</p></div></section>`;const r=state.reports.find(x=>x.id===state.lookupResult);if(!r)return '';return renderPublicReportDetail(r)}
function renderPublicReportDetail(r){const visibleNotes=(r.notes||[]).filter(n=>!n.internal);return `<section class="card card-pad"><div class="card-head"><div><div class="eyebrow">Folio de seguimiento</div><h2 style="font-size:21px;letter-spacing:-.3px;margin:0;color:#075cb1">${esc(r.id)}</h2><div class="card-sub">Última actualización: ${esc(r.updated||r.created)}</div></div>${statusBadge(r.status)}</div><div class="grid grid-2"><div>${r.image?`<img src="${r.image}" alt="Fotografía del reporte" class="image-preview" style="margin-top:0">`:`<div class="detail-image"><span class="tree"></span></div>`}<div style="margin-top:15px"><div class="card-sub">Tipo de reporte</div><strong style="display:block;margin-top:5px;font-size:14px">${esc(r.title||r.category)}</strong><p class="small muted" style="line-height:1.65">${esc(r.description)}</p></div><div class="info-pair" style="margin-top:15px"><div><small>Dependencia responsable</small><strong>${esc(r.department)}</strong></div><div><small>Fecha de recepción</small><strong>${esc(r.created)}</strong></div><div style="grid-column:span 2"><small>Ubicación</small><strong>${esc(r.location||'Por confirmar')}</strong></div></div></div><div><h3 class="card-title" style="margin-bottom:16px">Seguimiento del reporte</h3><div class="timeline">${['Recibido','Asignado','En proceso','Resuelto'].map((s,i)=>{const order=['Recibido','Asignado','En proceso','Resuelto'];const cur=order.indexOf(r.status);const passed=cur>=i||(r.status==='Cerrado'&&i===3);return `<div class="timeline-item ${passed?'done':''}"><div class="timeline-dot">${icon(passed?'check':'clock',11)}</div><div class="timeline-body"><strong>${s}</strong><p>${i===0?'El sistema registró tu reporte.':i===1?`Canalizado a ${esc(r.department)}.`:i===2?'La dependencia está atendiendo el caso.':r.status==='Resuelto'||r.status==='Cerrado'?'La dependencia registró la solución.':'Pendiente de resolución.'}</p>${i===0?`<small>${esc(r.created)}</small>`:i===cur?`<small>Estado actual · ${esc(r.updated)}</small>`:''}</div></div>`}).join('')}</div><div class="divider"></div><h3 class="card-title">Actualizaciones públicas</h3>${visibleNotes.length?visibleNotes.map(n=>`<div class="annotation"><strong>${esc(n.user)}</strong><span class="small muted" style="float:right">${esc(n.date)}</span><p>${esc(n.text)}</p></div>`).join(''):`<p class="small muted" style="line-height:1.6">Todavía no hay comentarios públicos adicionales.</p>`}</div></div><div style="margin-top:20px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn btn-ghost" data-action="go" data-page="lookup">${icon('search')} Consultar otro folio</button><button class="btn btn-primary" data-action="print-report" data-id="${esc(r.id)}">${icon('download')} Imprimir / Guardar PDF</button></div></section>`}
function renderAccount(){const mine=state.reports.filter(r=>r.citizen==='Ciudadano de prueba');return `${pageHead('Mi cuenta','Consulta los reportes asociados a tu perfil de demostración.') }<section class="card card-pad"><div style="display:flex;align-items:center;gap:14px"><div class="avatar" style="width:58px;height:58px;font-size:18px">MC</div><div><h2 style="margin:0;font-size:17px">Mi cuenta ciudadana</h2><div class="small muted" style="margin-top:6px">Perfil de demostración · No requiere iniciar sesión</div></div></div><div class="divider"></div><div class="grid grid-3">${metric('Reportes registrados',mine.length,'file')}${metric('En seguimiento',mine.filter(r=>!['Resuelto','Cerrado'].includes(r.status)).length,'clock','amber')}${metric('Concluidos',mine.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length,'checkCircle','green')}</div></section><div style="height:16px"></div><section class="card card-pad"><div class="card-head"><h3 class="card-title">Mis reportes</h3><button class="btn btn-primary btn-sm" data-action="go" data-page="new-report">${icon('plus')} Nuevo</button></div>${reportTable(mine,{showDep:true})}</section>`}
function renderDeptHome(){const rs=reportsForMode();const open=rs.filter(r=>!['Resuelto','Cerrado','Improcedente'].includes(r.status));return `${pageHead('Panel de la dependencia',`Gestiona los reportes de ${state.department}. Actualiza el avance y deja constancia de las acciones realizadas.`,`<button class="btn btn-primary" data-action="go" data-page="assigned">${icon('clipboard')} Ver asignados</button>`)}<section class="hero" style="min-height:160px;padding:23px 25px"><div class="hero-copy"><div class="hero-kicker">Área responsable</div><h2 style="font-size:25px">${esc(state.department)}</h2><p>Revisa los casos recibidos, registra anotaciones y documenta las soluciones para mantener informado al ciudadano.</p></div><div class="hero-art"><div class="circle">${icon(DEPARTMENTS.find(d=>d.name===state.department)?.icon||'building',68)}</div></div></section><div style="height:16px"></div><div class="grid grid-3">${metric('Reportes asignados',rs.length,'clipboard','blue','En esta dependencia')}${metric('En proceso',rs.filter(r=>r.status==='En proceso').length,'clock','amber','Atención en curso')}${metric('Resueltos',rs.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length,'checkCircle','green','Casos concluidos')}</div><div style="height:16px"></div><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Reportes recientes</h3><div class="card-sub">Abre cualquier reporte para actualizar su estado.</div></div><button class="link-btn" data-action="go" data-page="assigned">Ver todos ${icon('chevron',12)}</button></div>${reportTable(rs.slice(0,5),{showDep:false})}</section><div style="height:16px"></div><div class="grid grid-2"><section class="card card-pad"><div class="card-head"><h3 class="card-title">Acciones rápidas</h3>${icon('spark')}</div><div class="grid grid-2"><button class="btn btn-soft" data-action="go" data-page="assigned">${icon('clipboard')} Revisar asignados</button><button class="btn btn-soft" data-action="go" data-page="in-progress">${icon('clock')} Ver en proceso</button><button class="btn btn-soft" data-action="go" data-page="resolved">${icon('checkCircle')} Ver resueltos</button><button class="btn btn-soft" data-action="go" data-page="dept-stats">${icon('chart')} Mis estadísticas</button></div></section><section class="card card-pad"><div class="card-head"><h3 class="card-title">Recordatorio de atención</h3>${icon('alert')}</div><p class="small muted" style="line-height:1.7">Agrega comentarios claros, evita incluir información personal en las anotaciones públicas y adjunta evidencia cuando concluyas un trabajo. Toda modificación queda registrada en el historial.</p></section></div>`}
function renderReportListPage(title,subtitle,list,admin=false){return `${pageHead(title,subtitle,`<button class="btn btn-ghost" data-action="export-list">${icon('download')} Exportar PDF</button>`)}<section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Listado de reportes</h3><div class="card-sub">${list.length} registros visibles</div></div></div>${reportFilters()}<div style="height:14px"></div>${reportTable(filteredReports(list),{showDep:admin})}</section>`}
function adminHome(){const rs=state.reports,total=rs.length,res=rs.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length,inprog=rs.filter(r=>r.status==='En proceso').length,pending=rs.filter(r=>['Recibido','Asignado','En espera'].includes(r.status)).length;const deptCounts=DEPARTMENTS.map(d=>({...d,count:rs.filter(r=>r.department===d.name).length})).sort((a,b)=>b.count-a.count);const max=Math.max(1,...deptCounts.map(d=>d.count));const statuses=[['Recibidos',rs.filter(r=>r.status==='Recibido').length,'#6bbdea'],['En revisión',rs.filter(r=>r.status==='Asignado').length,'#ffb326'],['Asignados',rs.filter(r=>r.status==='En proceso').length,'#8b7adf'],['En espera',rs.filter(r=>r.status==='En espera').length,'#ee8c44'],['Resueltos',res,'#10ae78']];return `${pageHead('Dashboard','Vista general de los reportes ciudadanos y la atención de las dependencias.',`<button class="btn btn-ghost" data-action="export-dashboard">${icon('download')} Descargar informe PDF</button><button class="btn btn-primary" data-action="go" data-page="all-reports">${icon('file')} Todos los reportes</button>`)}<div class="grid grid-4">${metric('Total de reportes',rs.length,'file','blue','Acumulado en la plataforma','+12%')}${metric('En proceso',inprog,'clock','amber','Atención en curso')}${metric('Resueltos',res,'checkCircle','green',`${rs.length?Math.round(res/rs.length*100):0}% de los reportes`,'+')}${metric('Pendientes / en espera',pending,'alert','purple','Requieren seguimiento')}</div><div style="height:16px"></div><div class="grid grid-2"><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Reportes por dependencia</h3><div class="card-sub">Distribución de los casos registrados.</div></div><button class="link-btn" data-action="go" data-page="departments">Ver áreas</button></div><div style="display:flex;flex-direction:column;gap:13px">${deptCounts.filter(d=>d.count>0).slice(0,6).map((d,i)=>`<div><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:10px"><span style="color:#486783">${esc(d.name)}</span><strong style="color:#153c62">${d.count}</strong></div><div style="height:7px;background:#edf3f8;border-radius:20px;overflow:hidden"><div style="width:${d.count/max*100}%;height:100%;background:${['#0a6cc2','#12ac7c','#ffb321','#8572d8','#42b8e8','#ed7981'][i]};border-radius:20px"></div></div></div>`).join('')}${!rs.length?'<p class="small muted">Aún no hay registros.</p>':''}</div></section><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Estado de los reportes</h3><div class="card-sub">Distribución actual por estado.</div></div><button class="link-btn" data-action="go" data-page="statistics">Ver estadísticas</button></div><div class="donut-layout"><div class="donut" style="background:${donutGradient(rs)}"><div class="donut-center"><strong>${rs.length}</strong><small>reportes</small></div></div><div class="legend-list">${statuses.map(s=>`<div class="legend-row"><span class="legend-swatch" style="background:${s[2]}"></span><span>${s[0]}</span><strong>${s[1]}</strong></div>`).join('')}</div></div></section></div><div style="height:16px"></div><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Últimos reportes recibidos</h3><div class="card-sub">Actividad reciente en todas las dependencias.</div></div><button class="link-btn" data-action="go" data-page="all-reports">Ver todos ${icon('chevron',12)}</button></div>${reportTable(allReports().slice(0,6),{showDep:true})}</section><div style="height:16px"></div><div class="grid grid-3"><section class="card card-pad"><div class="metric-icon">${icon('users')}</div><h3 class="card-title" style="margin-top:12px">Usuarios y permisos</h3><p class="small muted" style="line-height:1.6">Administra las cuentas del personal municipal.</p><button class="btn btn-ghost btn-sm" data-action="go" data-page="users">Administrar usuarios ${icon('arrow',13)}</button></section><section class="card card-pad"><div class="metric-icon green">${icon('rules')}</div><h3 class="card-title" style="margin-top:12px">Asignación automática</h3><p class="small muted" style="line-height:1.6">Ajusta las reglas que determinan el área responsable.</p><button class="btn btn-ghost btn-sm" data-action="go" data-page="rules">Editar reglas ${icon('arrow',13)}</button></section><section class="card card-pad"><div class="metric-icon amber">${icon('shield')}</div><h3 class="card-title" style="margin-top:12px">Auditoría e historial</h3><p class="small muted" style="line-height:1.6">Revisa los cambios realizados en el sistema.</p><button class="btn btn-ghost btn-sm" data-action="go" data-page="audit">Consultar historial ${icon('arrow',13)}</button></section></div>`}
function donutGradient(rs){const defs=[['Recibido','#6bbdea'],['Asignado','#ffb326'],['En proceso','#8b7adf'],['En espera','#ee8c44'],['Resuelto','#10ae78'],['Cerrado','#8da2b4'],['Improcedente','#e56e7d']];let total=Math.max(rs.length,1),start=0,parts=[];defs.forEach(([s,c])=>{const n=rs.filter(r=>r.status===s).length;const end=start+n/total*100;if(n){parts.push(`${c} ${start}% ${end}%`)}start=end});return `conic-gradient(${parts.length?parts.join(','):'#e5edf4 0 100%'})`}
function renderDepartments(){const rs=state.reports;return `${pageHead('Dependencias municipales','Catálogo de áreas responsables y volumen de reportes asignados.',`<button class="btn btn-ghost" data-action="export-departments">${icon('download')} Exportar PDF</button>`)}<div class="grid grid-3">${DEPARTMENTS.map(d=>{const list=rs.filter(r=>r.department===d.name);const open=list.filter(r=>!['Resuelto','Cerrado','Improcedente'].includes(r.status)).length;return `<section class="card dept-card"><div class="dept-icon">${icon(d.icon)}</div><div style="flex:1;min-width:0"><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p><div class="dept-count">${list.length} reportes · ${open} pendientes</div><div style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-action="filter-department" data-department="${esc(d.name)}">Ver reportes ${icon('chevron',12)}</button></div></div></section>`}).join('')}</div><div style="height:18px"></div><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Resumen por área</h3><div class="card-sub">Volumen e indicadores de atención.</div></div></div><div class="table-wrap"><table><thead><tr><th>Dependencia</th><th>Reportes</th><th>En seguimiento</th><th>Resueltos</th><th>Porcentaje resuelto</th></tr></thead><tbody>${DEPARTMENTS.map(d=>{const list=rs.filter(r=>r.department===d.name),resolved=list.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length;return `<tr><td><span class="table-main">${esc(d.name)}</span></td><td>${list.length}</td><td>${list.filter(r=>!['Resuelto','Cerrado','Improcedente'].includes(r.status)).length}</td><td>${resolved}</td><td>${list.length?Math.round(resolved/list.length*100):0}%</td></tr>`}).join('')}</tbody></table></div></section>`}
function renderUsers(){return `${pageHead('Usuarios y permisos','Crea cuentas para el personal y limita el acceso al área correspondiente.',`<button class="btn btn-primary" data-action="new-user">${icon('plus')} Crear usuario</button>`)}<div class="grid grid-3">${metric('Usuarios registrados',state.users.length,'users')}${metric('Cuentas activas',state.users.filter(u=>u.active).length,'checkCircle','green')}${metric('Dependencias con acceso',new Set(state.users.filter(u=>u.role==='Dependencia'&&u.active).map(u=>u.department)).size,'building','purple')}</div><div style="height:16px"></div><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Directorio de usuarios</h3><div class="card-sub">El acceso de demostración utiliza usuario y contraseña; en producción debe conectarse a autenticación de servidor.</div></div><div class="input-icon" style="width:220px">${icon('search')}<input id="userSearch" placeholder="Buscar usuario…"></div></div><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre de usuario</th><th>Correo</th><th>Rol</th><th>Área asignada</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${state.users.map((u,i)=>`<tr data-user-row="${esc((u.name+' '+(u.username||'')+' '+u.email+' '+u.department).toLowerCase())}"><td><span class="table-main">${esc(u.name)}</span><span class="table-sub">ID ${String(i+1).padStart(3,'0')}</span></td><td><code>${esc(u.username||'—')}</code></td><td>${esc(u.email)}</td><td><span class="role-chip">${esc(u.role)}</span></td><td>${esc(u.department||'—')}</td><td><span class="status ${u.active?'s-resuelto':'s-cerrado'}">${u.active?'Activo':'Inactivo'}</span></td><td><button class="table-action" data-action="toggle-user" data-index="${i}">${u.active?'Desactivar':'Activar'}</button> <button class="table-action" data-action="edit-user" data-index="${i}">Editar</button></td></tr>`).join('')}</tbody></table></div></section>`}
function renderRules(){return `${pageHead('Reglas de asignación','Define qué dependencia recibirá cada categoría. Los cambios se guardan en este navegador.',`<button class="btn btn-primary" data-action="save-rules">${icon('check')} Guardar reglas</button>`)}<section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Enrutamiento automático por categoría</h3><div class="card-sub">Cada reporte nuevo se asignará de acuerdo con la regla vigente.</div></div><div class="metric-icon green">${icon('rules')}</div></div><div class="table-wrap"><table><thead><tr><th>Categoría del reporte</th><th>Dependencia asignada</th><th>Tipo de asignación</th></tr></thead><tbody>${CATEGORIES.map((c,i)=>`<tr><td><span class="table-main">${esc(c.value)}</span></td><td><select class="input rule-select" data-category="${esc(c.value)}" style="min-width:225px;padding:8px">${['Mesa de Control Municipal',...DEPARTMENTS.map(d=>d.name)].map(d=>`<option ${state.rules[c.value]===d?'selected':''}>${esc(d)}</option>`).join('')}</select></td><td><span class="status ${state.rules[c.value]==='Mesa de Control Municipal'?'s-en_espera':'s-resuelto'}">${state.rules[c.value]==='Mesa de Control Municipal'?'Revisión manual':'Automática'}</span></td></tr>`).join('')}</tbody></table></div><div class="divider"></div><div style="display:flex;gap:10px;align-items:flex-start;background:#fff7e4;border:1px solid #f5e2b5;border-radius:10px;padding:12px">${icon('alert',18)}<div class="small" style="line-height:1.6;color:#87621b"><strong>Nota operativa:</strong> las emergencias y riesgos inmediatos deben mostrar canales de emergencia y seguir los protocolos correspondientes. El portal de reportes no sustituye al 911.</div></div></section>`}
function statFilteredReports(){const f=state.statsFilter||{department:'Todas',status:'Todos',from:'',to:''};return state.reports.filter(r=>{if(f.department!=='Todas'&&r.department!==f.department)return false;if(f.status!=='Todos'&&r.status!==f.status)return false;const key=(r.created||'').split('/').reverse().join('-');if(f.from&&key<f.from)return false;if(f.to&&key>f.to)return false;return true})}
function renderStatistics(){const rs=statFilteredReports(),total=rs.length,res=rs.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length;const bars=[['Recibido',rs.filter(r=>r.status==='Recibido').length],['Asignado',rs.filter(r=>r.status==='Asignado').length],['En proceso',rs.filter(r=>r.status==='En proceso').length],['En espera',rs.filter(r=>r.status==='En espera').length],['Resuelto',res]];const max=Math.max(1,...bars.map(x=>x[1]));return `${pageHead('Estadísticas e informes','Indicadores de atención, distribución de reportes y documentos descargables.',`<button class="btn btn-primary" data-action="export-stats">${icon('download')} Exportar informe PDF</button>`)}<section class="card card-pad" style="margin-bottom:16px"><div class="filters"><div class="field"><label>Desde</label><input id="statsFrom" type="date" value="${esc(state.statsFilter.from)}"></div><div class="field"><label>Hasta</label><input id="statsTo" type="date" value="${esc(state.statsFilter.to)}"></div><div class="field" style="min-width:200px"><label>Dependencia</label><select id="statsDepartment"><option ${state.statsFilter.department==='Todas'?'selected':''}>Todas</option>${DEPARTMENTS.map(d=>`<option ${state.statsFilter.department===d.name?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>Estado</label><select id="statsStatus"><option ${state.statsFilter.status==='Todos'?'selected':''}>Todos</option>${['Recibido','Asignado','En proceso','En espera','Resuelto','Cerrado','Improcedente'].map(s=>`<option ${state.statsFilter.status===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn btn-primary" style="align-self:flex-end" data-action="apply-stats">${icon('filter')} Aplicar filtros</button></div><div class="small muted" style="margin-top:10px">Los filtros se aplican en el informe y los gráficos siguientes.</div></section><div class="grid grid-4" id="statsMetrics">${metric('Total de reportes',total,'file')}${metric('Resueltos',res,'checkCircle','green',`${total?Math.round(res/total*100):0}% de resolución`)}${metric('En proceso',bars[2][1],'clock','amber')}${metric('Pendientes',bars[0][1]+bars[1][1]+bars[3][1],'alert','purple')}</div><div style="height:16px"></div><div class="grid grid-2"><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Reportes por estado</h3><div class="card-sub">Distribución de todos los reportes registrados.</div></div></div><div style="display:flex;flex-direction:column;gap:14px;margin-top:20px" id="statsStatusBars">${bars.map((b,i)=>`<div><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px"><span>${b[0]}</span><strong>${b[1]}</strong></div><div style="height:10px;background:#edf3f8;border-radius:20px;overflow:hidden"><div style="height:100%;width:${b[1]/max*100}%;background:${['#6bbdea','#ffb326','#8572d8','#ee8c44','#10ae78'][i]};border-radius:20px"></div></div></div>`).join('')}</div></section><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Atención por dependencia</h3><div class="card-sub">Volumen registrado por cada área.</div></div></div><div style="display:flex;flex-direction:column;gap:11px;margin-top:18px">${DEPARTMENTS.map(d=>{const x=rs.filter(r=>r.department===d.name).length;return `<div><div style="display:flex;justify-content:space-between;gap:10px;font-size:10px;margin-bottom:5px"><span>${esc(d.name)}</span><strong>${x}</strong></div><div style="background:#edf3f8;height:7px;border-radius:12px;overflow:hidden"><div style="width:${x/Math.max(1,total)*100}%;height:100%;background:#0aa476;border-radius:12px"></div></div></div>`}).join('')}</div></section></div><div style="height:16px"></div><section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Documentos descargables</h3><div class="card-sub">Genera una versión imprimible y elige “Guardar como PDF” en el diálogo de impresión.</div></div>${icon('file')}</div><div class="grid grid-3"><div style="background:#f7fafd;border:1px solid #e1edf5;border-radius:12px;padding:16px"><div class="metric-icon">${icon('file')}</div><h3 class="card-title" style="margin-top:10px">Informe general</h3><p class="small muted" style="line-height:1.5">Todos los indicadores y el resumen ejecutivo de los reportes.</p><button class="btn btn-primary btn-sm" data-action="export-dashboard">${icon('download')} Generar PDF</button></div><div style="background:#f7fafd;border:1px solid #e1edf5;border-radius:12px;padding:16px"><div class="metric-icon green">${icon('building')}</div><h3 class="card-title" style="margin-top:10px">Por dependencia</h3><p class="small muted" style="line-height:1.5">Detalle de cargas de trabajo y avance por área municipal.</p><button class="btn btn-primary btn-sm" data-action="export-departments">${icon('download')} Generar PDF</button></div><div style="background:#f7fafd;border:1px solid #e1edf5;border-radius:12px;padding:16px"><div class="metric-icon amber">${icon('clock')}</div><h3 class="card-title" style="margin-top:10px">Pendientes y atrasados</h3><p class="small muted" style="line-height:1.5">Relación de casos abiertos que requieren seguimiento.</p><button class="btn btn-primary btn-sm" data-action="export-pending">${icon('download')} Generar PDF</button></div></div></section>`}
function renderMap(){const rs=state.mode==='dept'?reportsForMode():allReports();return `${pageHead(state.mode==='admin'?'Mapa general de reportes':'Mapa de reportes','Ubicaciones registradas en los reportes del sistema.',`<button class="btn btn-ghost" data-action="export-list">${icon('download')} Exportar listado</button>`)}<section class="card card-pad"><div class="map-preview" style="height:380px"><div class="map-river"></div>${rs.slice(0,10).map((r,i)=>`<button title="${esc(r.id+' · '+r.title)}" data-action="detail" data-id="${esc(r.id)}" style="position:absolute;left:${15+(i*17)%75}%;top:${20+(i*23)%65}%;z-index:4;border:0;background:transparent;color:${['#0870c9','#0a9d70','#e69a12','#8068c8'][i%4]};filter:drop-shadow(0 3px 4px #173c4d55)">${icon('pin',30)}</button>`).join('')}<div class="map-caption">Vista esquemática de demostración · Las ubicaciones reales se habilitan al integrar un proveedor cartográfico.</div></div><div class="legend" style="margin-top:14px"><span><i class="dot"></i> Reporte recibido</span><span><i class="dot green"></i> En atención</span><span><i class="dot" style="background:#ffb326"></i> En espera</span></div></section><div style="height:16px"></div><section class="card card-pad"><div class="card-head"><h3 class="card-title">Reportes con ubicación</h3></div>${reportTable(rs,{showDep:state.mode==='admin'})}</section>`}
function renderAudit(){return `${pageHead('Auditoría e historial','Registro de las operaciones importantes realizadas en la plataforma.',`<button class="btn btn-ghost" data-action="export-audit">${icon('download')} Exportar PDF</button>`)}<section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Actividad reciente</h3><div class="card-sub">Cambios de estado, asignaciones y operaciones administrativas.</div></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Elemento relacionado</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${esc(a.date)}</td><td><span class="table-main">${esc(a.user)}</span></td><td>${esc(a.action)}</td><td>${esc(a.target)}</td></tr>`).join('')}</tbody></table></div></section>`}
function renderNotifications(){return `${pageHead('Notificaciones','Avisos de actividad y seguimiento en el sistema.') }<div class="grid" style="gap:10px">${[{title:'Reporte nuevo recibido',desc:'Se recibió un reporte de semáforo descompuesto.',date:'Hoy',icon:'file'},{title:'Reporte en espera',desc:'Un reporte está a la espera de seguimiento.',date:'Ayer',icon:'clock'},{title:'Actualización de estado',desc:'Un reporte fue marcado como resuelto.',date:'Hace 2 días',icon:'checkCircle'}].map((n,i)=>`<section class="card" style="padding:16px;display:flex;align-items:flex-start;gap:13px"><div class="metric-icon ${i===1?'amber':i===2?'green':''}">${icon(n.icon)}</div><div style="flex:1"><strong style="font-size:12px">${n.title}</strong><p class="small muted" style="margin:5px 0 8px;line-height:1.5">${n.desc}</p><span class="small muted">${n.date}</span></div><span class="status ${i===2?'s-resuelto':'s-recibido'}">${i===2?'Leída':'Nueva'}</span></section>`).join('')}</div>`}
function renderSettings(){return `${pageHead('Configuración','Personaliza la identidad del municipio y algunos ajustes del prototipo.') }<section class="card card-pad"><div class="card-head"><div><h3 class="card-title">Datos de la plataforma</h3><div class="card-sub">En producción estos valores estarán guardados en el servidor.</div></div>${icon('settings')}</div><form id="settingsForm" class="form-grid"><div class="field"><label>Nombre de la plataforma</label><input name="name" value="${esc(state.settings.name)}" required></div><div class="field"><label>Prefijo de folio</label><input name="folioPrefix" value="${esc(state.settings.folioPrefix)}" pattern="[A-Za-z0-9-]{2,8}" required></div><div class="field span-2"><label>Nombre del municipio (para informes)</label><input name="municipality" value="${esc(state.settings.municipality)}" required></div><div class="field span-2"><label>Notificaciones del sistema</label><select name="notifications"><option value="true" ${state.settings.notifications?'selected':''}>Activadas</option><option value="false" ${!state.settings.notifications?'selected':''}>Desactivadas</option></select></div><div class="span-2"><button class="btn btn-primary">${icon('check')} Guardar configuración</button></div></form><div class="divider"></div><h3 class="card-title">Información del prototipo</h3><p class="small muted" style="line-height:1.7">Los datos se guardan localmente en este navegador. Para publicar la plataforma se debe conectar un backend con autenticación real, base de datos, almacenamiento privado, controles de acceso y respaldo.</p><button class="btn btn-danger btn-sm" data-action="reset-demo">Restablecer datos de demostración</button></section>`}
function renderDeptStats(){const rs=reportsForMode(),total=rs.length,res=rs.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length;return `${pageHead('Estadísticas de la dependencia',`Indicadores de atención de ${state.department}.`,`<button class="btn btn-ghost" data-action="export-list">${icon('download')} Exportar PDF</button>`)}<div class="grid grid-3">${metric('Reportes asignados',total,'file')}${metric('En proceso',rs.filter(r=>r.status==='En proceso').length,'clock','amber')}${metric('Resueltos',res,'checkCircle','green',`${total?Math.round(res/total*100):0}% de resolución`)}</div><div style="height:16px"></div><section class="card card-pad"><div class="card-head"><h3 class="card-title">Detalle de reportes de ${esc(state.department)}</h3></div>${reportTable(rs,{showDep:false})}</section>`}
function renderDetailPage(){const r=currentReport();if(!r)return `${pageHead('Detalle del reporte','Selecciona un reporte para consultar su información.')}<section class="card card-pad"><div class="empty">${icon('file')}<strong>Reporte no seleccionado</strong><p>Regresa al listado y abre el detalle de un reporte.</p><button class="btn btn-primary" data-action="go" data-page="${state.mode==='admin'?'all-reports':state.mode==='dept'?'assigned':'lookup'}">Volver al listado</button></div></section>`;const editable=canEditReport(r);return `${pageHead('Detalle del reporte',`Folio ${r.id} · Recibido el ${r.created}`,`<button class="btn btn-ghost" data-action="go" data-page="${state.mode==='admin'?'all-reports':state.mode==='dept'?'assigned':'lookup'}">${icon('back')} Volver</button><button class="btn btn-ghost" data-action="print-report" data-id="${esc(r.id)}">${icon('download')} PDF</button>`)}<div class="report-detail-grid"><div class="grid" style="gap:16px"><section class="card card-pad"><div class="card-head"><div><div class="eyebrow">Folio del reporte</div><h2 style="font-size:21px;color:#075cb1;margin:0">${esc(r.id)}</h2></div>${statusBadge(r.status)}</div><h3 style="font-size:16px;margin:0 0 8px">${esc(r.title||r.category)}</h3><p class="small muted" style="line-height:1.65">${esc(r.description)}</p>${r.image?`<img src="${r.image}" alt="Evidencia del reporte" class="image-preview">`:`<div class="detail-image"><span class="tree"></span></div>`}<div class="divider"></div><div class="info-pair"><div><small>Tipo de reporte</small><strong>${esc(r.category)}</strong></div><div><small>Fecha de recepción</small><strong>${esc(r.created)}</strong></div><div><small>Dependencia responsable</small><strong>${esc(r.department)}</strong></div><div><small>Última actualización</small><strong>${esc(r.updated)}</strong></div><div style="grid-column:span 2"><small>Ubicación</small><strong>${esc(r.location||'Por confirmar')}</strong><div style="margin-top:9px" class="map-preview"><div class="map-river"></div><div class="map-pin">${icon('pin',34)}</div><div class="map-caption">${esc(r.location||'Ubicación por confirmar')} · ${esc(r.coords||'Sin coordenadas')}</div></div></div></div></section><section class="card card-pad"><div class="card-head"><h3 class="card-title">Historial de movimientos</h3>${icon('clock')}</div><div class="timeline"><div class="timeline-item done"><div class="timeline-dot">${icon('check',11)}</div><div class="timeline-body"><strong>Reporte recibido</strong><p>El sistema generó el folio y guardó la información.</p><small>${esc(r.created)}</small></div></div><div class="timeline-item done"><div class="timeline-dot">${icon('check',11)}</div><div class="timeline-body"><strong>Asignación</strong><p>Turnado a ${esc(r.department)}.</p><small>${esc(r.created)}</small></div></div>${(r.notes||[]).map(n=>`<div class="timeline-item done"><div class="timeline-dot">${icon(n.internal?'clipboard':'message',11)}</div><div class="timeline-body"><strong>${n.internal?'Anotación interna':'Comentario público'} · ${esc(n.user)}</strong><p>${esc(n.text)}</p><small>${esc(n.date)} ${n.internal?'· Solo personal municipal':''}</small></div></div>`).join('')}</div></section></div><div class="grid" style="align-content:start;gap:16px">${editable?`<section class="card card-pad"><div class="card-head"><h3 class="card-title">Actualizar reporte</h3><div class="metric-icon green">${icon('clipboard')}</div></div><form id="updateReportForm" data-id="${esc(r.id)}"><div class="field"><label>Estado del reporte</label><select name="status">${['Recibido','Asignado','En proceso','En espera','Resuelto','Cerrado','Improcedente'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div>${state.mode==='admin'?`<div class="field" style="margin-top:12px"><label>Dependencia responsable</label><select name="department">${['Mesa de Control Municipal',...DEPARTMENTS.map(d=>d.name)].map(s=>`<option ${r.department===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`:''}<div class="field" style="margin-top:12px"><label>Motivo o comentario público</label><textarea name="publicNote" maxlength="600" placeholder="Ej. Se programó atención para esta semana…" style="min-height:78px"></textarea><small>Este mensaje podrá verlo la persona que consulte el folio.</small></div><div class="field" style="margin-top:12px"><label>Anotación interna</label><textarea name="internalNote" maxlength="600" placeholder="Notas para el equipo municipal…" style="min-height:78px"></textarea><small>Solo visible para usuarios autorizados.</small></div><button class="btn btn-primary full" style="margin-top:15px">${icon('check')} Guardar cambios</button></form><div class="divider"></div><button class="btn btn-ghost full" data-action="evidence" data-id="${esc(r.id)}">${icon('camera')} Adjuntar evidencia fotográfica</button></section>`:`<section class="card card-pad"><div class="card-head"><h3 class="card-title">Información pública</h3>${icon('info')}</div><p class="small muted" style="line-height:1.65">La consulta ciudadana es de solo lectura. Para hacer cambios, ingresa con una cuenta autorizada del área responsable.</p><button class="btn btn-primary full" data-action="mode" data-mode="dept">Cambiar a vista de dependencia</button></section>`}<section class="card card-pad"><div class="card-head"><h3 class="card-title">Anotaciones registradas</h3>${icon('message')}</div>${r.notes?.length?r.notes.slice().reverse().map(n=>`<div class="annotation"><strong>${esc(n.user)} ${n.internal?'<span class="role-chip">Interna</span>':'<span class="role-chip" style="background:#e3f8ef;color:#087e5d">Pública</span>'}</strong><span class="small muted" style="float:right">${esc(n.date)}</span><p>${esc(n.text)}</p></div>`).join(''):`<p class="small muted">Todavía no hay anotaciones.</p>`}</section></div></div>`}
function renderPage(){switch(state.page){case'home':return homeCitizen();case'new-report':return renderNewReport();case'lookup':return renderLookup();case'account':return renderAccount();case'dept-home':return renderDeptHome();case'assigned':return renderReportListPage('Reportes asignados',`Casos canalizados a ${state.department}.`,reportsForMode());case'in-progress':return renderReportListPage('Reportes en proceso','Casos que se encuentran en atención.',reportsForMode().filter(r=>r.status==='En proceso'));case'resolved':return renderReportListPage('Reportes resueltos','Casos con resolución documentada.',reportsForMode().filter(r=>['Resuelto','Cerrado'].includes(r.status)));case'dept-stats':return renderDeptStats();case'admin-home':return adminHome();case'all-reports':return renderReportListPage('Todos los reportes','Vista integral de los reportes recibidos por el municipio.',allReports(),true);case'departments':return renderDepartments();case'users':return renderUsers();case'rules':return renderRules();case'map':return renderMap();case'statistics':return renderStatistics();case'audit':return renderAudit();case'notifications':return renderNotifications();case'settings':return renderSettings();case'detail':return renderDetailPage();default:return state.mode==='admin'?adminHome():state.mode==='dept'?renderDeptHome():homeCitizen()}}
function render(){document.getElementById('app').innerHTML=state.page==='login'?renderLogin():renderShell();}
function navigate(page){if(page==='login'){state.page='login';render();return}if((page==='admin-home'||['all-reports','departments','users','rules','statistics','audit','settings'].includes(page))&&state.mode!=='admin'){toast('Inicia sesión como administrador para entrar a ese apartado.','error');return}if((['dept-home','assigned','in-progress','resolved','dept-stats'].includes(page))&&state.mode!=='dept'){toast('Inicia sesión con una cuenta de dependencia para entrar a ese apartado.','error');return}state.page=page;render();window.scrollTo({top:0,behavior:'smooth'});}
function setMode(mode){if(mode==='citizen'){state.mode='citizen';state.authenticatedUser=null;state.page='home';render();return}state.page='login';render();}
function createFolio(){const prefix=state.settings.folioPrefix||'MUN';let max=0;state.reports.forEach(r=>{const m=r.id.match(/(\d+)$/);if(m)max=Math.max(max,Number(m[1]))});return `${prefix}-${new Date().getFullYear()}-${String(max+1).padStart(6,'0')}`}
function showDetail(id){state.selectedReport=id;state.page='detail';render();window.scrollTo({top:0,behavior:'smooth'})}
function handleNewReport(form){const fd=new FormData(form);const cat=fd.get('category');const rule=state.rules[cat]||CATEGORIES.find(c=>c.value===cat)?.dep||'Mesa de Control Municipal';let report={id:createFolio(),category:cat,title:cat,description:fd.get('description').trim(),department:rule,status:rule==='Mesa de Control Municipal'?'Recibido':'Asignado',location:fd.get('location').trim(),coords:[fd.get('lat'),fd.get('lng')].filter(Boolean).join(', ')||'',created:nowDate(),updated:nowDate(),citizen:(fd.get('citizen')||'').trim()||'Ciudadano de prueba',contact:(fd.get('contact')||'').trim(),image:document.getElementById('photoPreview')?.dataset.dataurl||'',notes:[{text:'El reporte fue recibido y turnado por el sistema.',user:'Sistema Mi Municipio',date:nowDate(),internal:true}]};if(rule==='Mesa de Control Municipal')report.notes.push({text:'Tu reporte quedó registrado y será revisado para determinar el área responsable.',user:'Sistema Mi Municipio',date:nowDate(),internal:false});state.reports.unshift(report);persist();addAudit('Reporte creado y asignado',report.id);state.newReportSuccess=report.id;state.queryFolio=report.id;state.lookupResult=report.id;state.page='report-created';renderCreatedSuccess();}
function renderCreatedSuccess(){const r=state.reports.find(x=>x.id===state.newReportSuccess);const main=document.getElementById('mainContent');main.innerHTML=`${pageHead('¡Reporte recibido!','El reporte quedó registrado en el prototipo. Guarda el folio para consultar su avance.')}<section class="card card-pad" style="max-width:760px;margin:auto;text-align:center;padding:32px"><div style="width:70px;height:70px;border-radius:50%;background:#e2f8ef;color:#00976b;display:grid;place-items:center;margin:0 auto 16px">${icon('checkCircle',37)}</div><div class="eyebrow">Folio generado</div><h2 style="font-size:30px;letter-spacing:.5px;color:#075cb1;margin:5px 0 10px">${esc(r.id)}</h2><p class="muted" style="max-width:500px;margin:0 auto 20px;line-height:1.7">Tu reporte fue registrado. La dependencia responsable es <strong>${esc(r.department)}</strong>. Utiliza el folio para consultar sus actualizaciones.</p><div style="max-width:430px;margin:0 auto 20px;background:#f7fafd;border:1px solid #e3edf5;border-radius:12px;padding:16px;text-align:left"><div class="info-pair"><div><small>Problema</small><strong>${esc(r.category)}</strong></div><div><small>Estado actual</small>${statusBadge(r.status)}</div><div style="grid-column:span 2"><small>Ubicación</small><strong>${esc(r.location)}</strong></div></div></div><div style="display:flex;justify-content:center;gap:9px;flex-wrap:wrap"><button class="btn btn-primary" data-action="copy-folio" data-id="${esc(r.id)}">${icon('clipboard')} Copiar folio</button><button class="btn btn-green" data-action="lookup-created">Consultar seguimiento ${icon('arrow')}</button><button class="btn btn-ghost" data-action="go" data-page="new-report">Crear otro reporte</button></div><p class="small muted" style="margin-top:18px">Prototipo de demostración: el registro se conserva en este navegador.</p></section>`;window.scrollTo({top:0,behavior:'smooth'})}
function renderUserModal(index=null){const u=index===null?{name:'',username:'',email:'',password:'',role:'Dependencia',department:DEPARTMENTS[0].name,active:true}:state.users[index];state.modal={type:'user',index};document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3>${index===null?'Crear usuario':'Editar usuario'}</h3><button class="icon-btn" data-action="close-modal">${icon('close')}</button></div><form id="userForm" data-index="${index===null?'':index}"><div class="field"><label>Nombre completo *</label><input name="name" value="${esc(u.name)}" required maxlength="100"></div><div class="field" style="margin-top:13px"><label>Nombre de usuario *</label><input name="username" value="${esc(u.username||'')}" required minlength="3" maxlength="40" autocomplete="off" placeholder="Ej. jperez"></div><div class="field" style="margin-top:13px"><label>Correo institucional *</label><input name="email" type="email" value="${esc(u.email)}" required></div><div class="field" style="margin-top:13px"><label>${index===null?'Contraseña inicial *':'Cambiar contraseña (opcional)'}</label><input name="password" type="password" ${index===null?'required minlength="8"':'minlength="8"'} autocomplete="new-password" placeholder="${index===null?'Mínimo 8 caracteres':'Déjalo vacío para conservarla'}"></div><div class="field" style="margin-top:13px"><label>Rol *</label><select name="role"><option value="Dependencia" ${u.role==='Dependencia'?'selected':''}>Dependencia</option><option value="Administrador" ${u.role==='Administrador'?'selected':''}>Administrador</option></select></div><div class="field" style="margin-top:13px"><label>Dependencia asignada</label><select name="department">${['Administración central',...DEPARTMENTS.map(d=>d.name)].map(d=>`<option ${u.department===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="field" style="margin-top:13px"><label>Estado de la cuenta</label><select name="active"><option value="true" ${u.active?'selected':''}>Activa</option><option value="false" ${!u.active?'selected':''}>Inactiva</option></select></div><p class="small muted">La cuenta podrá iniciar sesión con su nombre de usuario o correo institucional. Esta versión de demostración guarda los datos en el navegador.</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-primary">${icon('check')} Guardar usuario</button></div></form></section></div>`;}
function closeModal(){state.modal=null;document.getElementById('modalRoot').innerHTML=''}
function printHtml(title,subtitle,body){return `<div class="print-area"><div class="print-head"><div style="display:flex;align-items:center;gap:12px">${municipalSeal()}<div><div style="font-size:9px;font-weight:800;letter-spacing:.5px;color:#164879">H. AYUNTAMIENTO DE SAN JUAN DE LOS LAGOS</div><h1>${esc(state.settings.municipality||'Mi Municipio')}</h1><p>${esc(title)} · ${esc(subtitle)}</p></div></div><div style="text-align:right;font-size:10px;color:#6d8297">Generado el<br><strong>${nowDate()}</strong></div></div>${body}<div class="print-note">Documento de demostración generado por Mi Municipio. Verifica los datos antes de usarlo como informe oficial.</div></div>`}
function doPrint(title,subtitle,body){const app=document.getElementById('app');const previous=app.innerHTML;app.innerHTML=printHtml(title,subtitle,body);document.body.classList.add('printing');const cleanup=()=>{document.body.classList.remove('printing');app.innerHTML=previous;render();window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);setTimeout(()=>window.print(),200)}
function htmlReportTable(list){return `<table><thead><tr><th>Folio</th><th>Categoría / problema</th><th>Ubicación</th><th>Dependencia</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.category)}<br>${esc(r.title)}</td><td>${esc(r.location)}</td><td>${esc(r.department)}</td><td>${esc(r.status)}</td><td>${esc(r.created)}</td></tr>`).join('')}</tbody></table>`}
function exportReports(title,list){doPrint(title,`${list.length} registros`,htmlReportTable(list))}
function exportDashboard(){const rs=state.reports;const resolved=rs.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length;const body=`<div class="grid grid-4" style="margin-bottom:16px">${[['Total de reportes',rs.length],['Resueltos',resolved],['En proceso',rs.filter(r=>r.status==='En proceso').length],['Pendientes',rs.filter(r=>['Recibido','Asignado','En espera'].includes(r.status)).length]].map(x=>`<div class="card card-pad"><div class="small muted">${x[0]}</div><div style="font-size:25px;font-weight:850;margin-top:8px">${x[1]}</div></div>`).join('')}</div><h2 style="font-size:15px;margin:18px 0 10px">Reportes por dependencia</h2><table><thead><tr><th>Dependencia</th><th>Total</th><th>En seguimiento</th><th>Resueltos</th></tr></thead><tbody>${DEPARTMENTS.map(d=>{const x=rs.filter(r=>r.department===d.name);return `<tr><td>${esc(d.name)}</td><td>${x.length}</td><td>${x.filter(r=>!['Resuelto','Cerrado','Improcedente'].includes(r.status)).length}</td><td>${x.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length}</td></tr>`}).join('')}</tbody></table><h2 style="font-size:15px;margin:22px 0 10px">Detalle de reportes</h2>${htmlReportTable(rs)}`;doPrint('Informe general de reportes',`Total de reportes: ${rs.length}`,body)}
function exportDepartments(){const rs=state.reports;const body=`<table><thead><tr><th>Dependencia</th><th>Reportes</th><th>En seguimiento</th><th>Resueltos</th><th>% resueltos</th></tr></thead><tbody>${DEPARTMENTS.map(d=>{const x=rs.filter(r=>r.department===d.name);const done=x.filter(r=>['Resuelto','Cerrado'].includes(r.status)).length;return `<tr><td>${esc(d.name)}</td><td>${x.length}</td><td>${x.filter(r=>!['Resuelto','Cerrado','Improcedente'].includes(r.status)).length}</td><td>${done}</td><td>${x.length?Math.round(done/x.length*100):0}%</td></tr>`}).join('')}</tbody></table>`;doPrint('Informe por dependencia',`${DEPARTMENTS.length} áreas municipales`,body)}
function openReportPrint(id){const r=state.reports.find(x=>x.id===id);if(!r)return;const body=`<div class="grid grid-2"><div class="card card-pad"><div class="small muted">Folio</div><h2 style="font-size:22px;color:#075cb1">${esc(r.id)}</h2><div class="small muted">Estado actual</div><strong>${esc(r.status)}</strong><div class="divider"></div><div class="small muted">Categoría</div><strong>${esc(r.category)}</strong><div class="divider"></div><div class="small muted">Dependencia responsable</div><strong>${esc(r.department)}</strong><div class="divider"></div><div class="small muted">Ubicación</div><strong>${esc(r.location)}</strong></div><div class="card card-pad"><div class="small muted">Descripción</div><p style="font-size:12px;line-height:1.7">${esc(r.description)}</p><div class="small muted">Fecha de recepción</div><strong>${esc(r.created)}</strong><div class="divider"></div><div class="small muted">Última actualización</div><strong>${esc(r.updated)}</strong></div></div><h2 style="font-size:15px;margin-top:20px">Historial y anotaciones</h2>${(r.notes||[]).length?`<table><thead><tr><th>Fecha</th><th>Usuario</th><th>Tipo</th><th>Comentario</th></tr></thead><tbody>${r.notes.map(n=>`<tr><td>${esc(n.date)}</td><td>${esc(n.user)}</td><td>${n.internal?'Interno':'Público'}</td><td>${esc(n.text)}</td></tr>`).join('')}</tbody></table>`:'<p>No hay anotaciones registradas.</p>'}`;doPrint('Ficha individual de reporte',r.id,body)}
function handleClick(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;switch(a){case'mode':setMode(el.dataset.mode);break;case'staff-login':state.page='login';render();break;case'citizen-home':state.mode='citizen';state.authenticatedUser=null;state.page='home';state.selectedReport=null;render();break;case'logout':{const who=state.authenticatedUser?.email||state.mode;addAudit('Sesión cerrada',who);state.mode='citizen';state.authenticatedUser=null;state.page='home';state.selectedReport=null;render();toast('Sesión cerrada correctamente.');break;}case'go':if(el.dataset.page==='notifications'&&state.mode==='citizen'){navigate('notifications')}else navigate(el.dataset.page);break;case'detail':showDetail(el.dataset.id);break;case'clear-filters':state.search='';state.statusFilter='Todos';state.departmentFilter='Todas';state.categoryFilter='Todas';render();break;case'filter-department':state.departmentFilter=el.dataset.department;state.page='all-reports';render();break;case'new-user':renderUserModal();break;case'edit-user':renderUserModal(Number(el.dataset.index));break;case'toggle-user':{const u=state.users[Number(el.dataset.index)];if(u){u.active=!u.active;persist();addAudit(u.active?'Usuario activado':'Usuario desactivado',u.email);render();toast(`Cuenta ${u.active?'activada':'desactivada'}.`)}}break;case'close-modal':closeModal();break;case'save-rules':document.querySelectorAll('.rule-select').forEach(s=>state.rules[s.dataset.category]=s.value);persist();addAudit('Reglas de asignación actualizadas','Categorías');render();toast('Reglas de asignación guardadas.');break;case'locate':locateUser();break;case'choose-location':{const loc=document.getElementById('reportLocation');if(loc)loc.value='Centro municipal, calle principal';const lat=document.getElementById('reportLat');if(lat)lat.value='21.0185';const lng=document.getElementById('reportLng');if(lng)lng.value='-102.2892';const cap=document.getElementById('mapCaption');if(cap)cap.textContent='Ubicación de ejemplo · Centro municipal';toast('Se colocó la ubicación de ejemplo.');}break;case'sample-lookup':state.queryFolio='MUN-2026-001248';state.lookupResult=state.queryFolio;render();break;case'lookup-created':state.page='lookup';state.queryFolio=state.newReportSuccess;state.lookupResult=state.newReportSuccess;render();break;case'copy-folio':navigator.clipboard?.writeText(el.dataset.id).then(()=>toast('Folio copiado.')).catch(()=>toast('Folio: '+el.dataset.id));if(!navigator.clipboard)toast('Folio: '+el.dataset.id);break;case'print-report':openReportPrint(el.dataset.id);break;case'export-list':exportReports('Relación de reportes',filteredReports(state.mode==='dept'?reportsForMode():allReports()));break;case'export-dashboard':exportDashboard();break;case'export-departments':exportDepartments();break;case'export-pending':exportReports('Reportes pendientes y en espera',allReports().filter(r=>['Recibido','Asignado','En proceso','En espera'].includes(r.status)));break;case'export-audit':doPrint('Auditoría e historial',`${state.audit.length} movimientos`,`<table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Elemento</th></tr></thead><tbody>${state.audit.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td></tr>`).join('')}</tbody></table>`);break;case'apply-stats':{state.statsFilter={department:document.getElementById('statsDepartment')?.value||'Todas',status:document.getElementById('statsStatus')?.value||'Todos',from:document.getElementById('statsFrom')?.value||'',to:document.getElementById('statsTo')?.value||''};const count=statFilteredReports().length;render();toast(`Filtros aplicados: ${count} reportes coinciden.`);break;}case'export-stats':exportReports('Informe estadístico filtrado',statFilteredReports());break;case'evidence':openEvidence(el.dataset.id);break;case'reset-demo':if(confirm('¿Restablecer todos los reportes, usuarios y reglas a los datos iniciales de demostración?')){localStorage.removeItem('mm_reports');localStorage.removeItem('mm_users');localStorage.removeItem('mm_rules');localStorage.removeItem('mm_audit');loadData();state.mode='citizen';state.authenticatedUser=null;state.page='home';render();toast('Datos de demostración restablecidos.')}break;case'toggle-notifications':navigate('notifications');break;case'reset-report':state.pendingPhoto=null;setTimeout(()=>{const img=document.getElementById('photoPreview');if(img){img.src='';img.style.display='none';delete img.dataset.dataurl;}const zone=document.querySelector('.upload-zone strong');if(zone)zone.textContent='Agregar fotografía del problema';},0);break;}}
function locateUser(){const btn=document.querySelector('[data-action="locate"]');if(!navigator.geolocation){toast('Este navegador no permite obtener la ubicación.', 'error');return}btn?.setAttribute('disabled','disabled');if(btn)btn.textContent='Obteniendo ubicación…';navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude.toFixed(6),lng=pos.coords.longitude.toFixed(6);const la=document.getElementById('reportLat'),lo=document.getElementById('reportLng');if(la)la.value=lat;if(lo)lo.value=lng;const cap=document.getElementById('mapCaption');if(cap)cap.textContent=`Ubicación detectada · ${lat}, ${lng}`;if(btn){btn.disabled=false;btn.innerHTML=icon('pin')+' Ubicación obtenida'}toast('Ubicación obtenida. Revisa que el pin corresponda al lugar del problema.');},err=>{if(btn){btn.disabled=false;btn.innerHTML=icon('pin')+' Usar mi ubicación'}toast(err.code===1?'Permiso de ubicación denegado. Puedes capturar la dirección manualmente.':'No se pudo obtener la ubicación. Captura la dirección manualmente.','error')},{enableHighAccuracy:true,timeout:9000,maximumAge:60000})}
function openEvidence(id){const r=state.reports.find(x=>x.id===id);if(!r)return;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3>Adjuntar evidencia fotográfica</h3><button class="icon-btn" data-action="close-modal">${icon('close')}</button></div><p class="small muted">La evidencia se agregará al reporte ${esc(r.id)}.</p><form id="evidenceForm" data-id="${esc(id)}"><div class="field"><label>Fotografía</label><input name="evidence" type="file" accept="image/*" required></div><div class="field" style="margin-top:12px"><label>Comentario de la evidencia</label><textarea name="note" placeholder="Describe qué muestra la fotografía…" maxlength="400"></textarea></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-primary">Adjuntar evidencia</button></div></form></section></div>`;}
async function compressImage(file){if(file.size>8*1024*1024)throw new Error('La imagen supera el límite de 8 MB.');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('No se pudo leer la imagen.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('El archivo no parece ser una imagen válida.'));img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)})}
function attachEvents(){document.getElementById('app').addEventListener('click',handleClick);document.getElementById('app').addEventListener('submit',async e=>{const form=e.target;if(!form.matches('form'))return;if(form.id==='loginForm'){e.preventDefault();const fd=new FormData(form),identity=(fd.get('identity')||'').trim().toLowerCase(),password=fd.get('password')||'',role=fd.get('role');const user=state.users.find(u=>u.active&&u.role===role&&((u.username||'').toLowerCase()===identity||(u.email||'').toLowerCase()===identity)&&u.password===password);if(!user){toast('Usuario, contraseña o tipo de acceso incorrectos. Revisa también si la cuenta está activa.','error');return}state.authenticatedUser=user;state.mode=user.role==='Administrador'?'admin':'dept';state.department=user.role==='Administrador'?'Administración central':user.department;state.page=user.role==='Administrador'?'admin-home':'dept-home';state.selectedReport=null;addAudit('Sesión iniciada',user.email);render();toast('Bienvenido, '+user.name+'.');return}if(form.id==='newReportForm'){e.preventDefault();if(!form.reportCategory.value||!form.reportDescription.value.trim()||!form.reportLocation.value.trim()){toast('Completa los campos obligatorios.','error');return}try{if(document.getElementById('reportPhoto')?.files?.[0]){const data=await compressImage(document.getElementById('reportPhoto').files[0]);document.getElementById('photoPreview').dataset.dataurl=data;}handleNewReport(form)}catch(err){toast(err.message||'No se pudo adjuntar la imagen.','error')}return}if(form.id==='lookupForm'||form.id==='quickLookup'){e.preventDefault();const folio=(new FormData(form).get('folio')||'').trim().toUpperCase();state.queryFolio=folio;const found=state.reports.find(r=>r.id.toUpperCase()===folio);state.lookupResult=found?found.id:'notfound';state.page='lookup';render();return}if(form.id==='updateReportForm'){e.preventDefault();const r=state.reports.find(x=>x.id===form.dataset.id);if(!r)return;const fd=new FormData(form);const nextStatus=fd.get('status'),nextDep=fd.get('department');const oldStatus=r.status,oldDep=r.department;r.status=nextStatus;r.updated=nowDate();if(nextDep&&state.mode==='admin')r.department=nextDep;const pub=(fd.get('publicNote')||'').trim(),internal=(fd.get('internalNote')||'').trim();if(pub)r.notes.push({text:pub,user:state.mode==='admin'?'Administrador Municipal':'Juan Pérez',date:nowDate(),internal:false});if(internal)r.notes.push({text:internal,user:state.mode==='admin'?'Administrador Municipal':'Juan Pérez',date:nowDate(),internal:true});persist();if(oldStatus!==r.status)addAudit(`Estado cambiado de ${oldStatus} a ${r.status}`,r.id);if(oldDep!==r.department)addAudit(`Reporte reasignado a ${r.department}`,r.id);if(pub||internal)addAudit('Anotaciones agregadas',r.id);render();toast('Reporte actualizado correctamente.');return}if(form.id==='userForm'){e.preventDefault();if(state.mode!=='admin'){toast('Solo el administrador puede administrar cuentas.','error');return}const fd=new FormData(form),index=form.dataset.index===''?-1:Number(form.dataset.index),username=fd.get('username').trim(),email=fd.get('email').trim(),password=(fd.get('password')||'').trim();if(state.users.some((u,i)=>i!==index&&((u.username||'').toLowerCase()===username.toLowerCase()||u.email.toLowerCase()===email.toLowerCase()))){toast('Ese nombre de usuario o correo ya está registrado.','error');return}if(index<0&&!password){toast('Asigna una contraseña inicial.','error');return}if(password&&password.length<8){toast('La contraseña debe tener al menos 8 caracteres.','error');return}const previous=index<0?{}:state.users[index];const user={...previous,name:fd.get('name').trim(),username,email,role:fd.get('role'),department:fd.get('role')==='Administrador'?'Administración central':fd.get('department'),active:fd.get('active')==='true'};if(password)user.password=password;if(index<0){state.users.push(user);addAudit('Usuario creado',user.email)}else{state.users[index]=user;addAudit('Usuario editado',user.email)}persist();closeModal();render();toast('Usuario guardado correctamente.');return}if(form.id==='settingsForm'){e.preventDefault();const fd=new FormData(form);state.settings.name=fd.get('name').trim();state.settings.folioPrefix=fd.get('folioPrefix').trim().toUpperCase();state.settings.municipality=fd.get('municipality').trim();state.settings.notifications=fd.get('notifications')==='true';persist();addAudit('Configuración actualizada','Plataforma');render();toast('Configuración guardada.');return}if(form.id==='evidenceForm'){e.preventDefault();try{const file=new FormData(form).get('evidence'),data=await compressImage(file),r=state.reports.find(x=>x.id===form.dataset.id);r.image=data;const note=(new FormData(form).get('note')||'').trim();if(note)r.notes.push({text:note,user:state.mode==='admin'?'Administrador Municipal':'Juan Pérez',date:nowDate(),internal:true});r.updated=nowDate();persist();addAudit('Evidencia fotográfica adjuntada',r.id);closeModal();render();toast('Evidencia adjuntada correctamente.')}catch(err){toast(err.message||'No se pudo adjuntar el archivo.','error')}return}});
document.getElementById('app').addEventListener('input',e=>{if(e.target.id==='reportDescription'){const c=document.getElementById('descriptionCounter');if(c)c.textContent=`${e.target.value.length} / 1000 caracteres`}if(e.target.id==='reportSearch'){state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('reportSearch');if(next){next.focus();next.setSelectionRange(pos,pos)}}if(e.target.id==='userSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-user-row]').forEach(row=>row.style.display=row.dataset.userRow.includes(q)?'':'none')}});
document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='statusFilter'){state.statusFilter=e.target.value;render()}if(e.target.id==='departmentFilter'){state.departmentFilter=e.target.value;render()}if(e.target.id==='reportPhoto'){const file=e.target.files?.[0];if(!file)return;if(file.size>8*1024*1024){toast('La imagen supera el límite de 8 MB.','error');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{const img=document.getElementById('photoPreview');img.src=reader.result;img.style.display='block';img.dataset.dataurl=reader.result;const zone=e.target.closest('.upload-zone');if(zone)zone.querySelector('strong').textContent=file.name};reader.readAsDataURL(file)}});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});
}
function renderAfterSearch(){render()}
loadData();attachEvents();state.mode='citizen';state.authenticatedUser=null;state.page='home';render();
})();
</script>
